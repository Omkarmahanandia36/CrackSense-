version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cracksense_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cracksense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cracksense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cracksense_backend
    restart: always
    environment:
      APP_NAME: "CrackSense AI"
      APP_ENV: "production"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@db:5432/cracksense_db"
      SECRET_KEY: "cracksense-super-secret-key-change-in-production"
      UPLOAD_DIRECTORY: "/app/storage/uploads"
      REPORT_DIRECTORY: "/app/storage/reports"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
